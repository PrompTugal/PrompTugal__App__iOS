name: iOS release

# Packaging and distribution for the apps in apps.json (contracts section 5).
#
#   changes   ubuntu: which apps this run touches, from apps.json and the diff
#             (ios-changes.yml). An app whose project does not exist yet is skipped.
#   package   per affected app: pushes to dev (not docs/site-only), release tags,
#             and by hand. Unsigned: .xcarchive, .ipa (Payload/<App>.app zipped) and
#             a simulator .app, uploaded as artifacts. Needs no Apple account.
#   testflight  per affected app with "testflight": true whose unsigned package
#             succeeded: signs, exports and uploads to THAT app's App Store Connect
#             record. The built bundle id must equal apps.json, and the record must
#             exist for it, or nothing is uploaded.
#
# Triggers
#   push to dev          website.yml bumps VERSION and tags vX.Y.Z; this workflow then runs
#                        (workflow_run) on that release commit. Every app whose files changed since
#                        its own last build uploads, unless paused. App version = the tag, without v.
#   tags                 team-v*, promptugal-v*, riskmandate-v* release that app;
#                        the old ios-v* means the app with bundle news.promptugal.reader
#   workflow_dispatch    input "app": all, or one app; "upload" or "dry_run" to sign
#
# Pausing (repository variables, Settings > Secrets and variables > Actions > Variables)
#   TESTFLIGHT_ON_PUSH=false           pauses push uploads of every app
#   TESTFLIGHT_ON_PUSH_TEAM=false      pauses one app (…_PROMPTUGAL, …_RISKMANDATE)
#   Tags and manual runs still upload.
#
# Version: MARKETING_VERSION of every app = VERSION at the built commit (v0.4.7 -> 0.4.7), passed to
# xcodebuild. Summary and TestFlight notes say "0.4.7 (build) · tag v0.4.7 · commit <sha>".
# Build number: CFBundleVersion = run number of THIS workflow + the app's offset, passed as
# CURRENT_PROJECT_VERSION. Offset: variable IOS_BUILD_OFFSET_<APP>, else IOS_BUILD_OFFSET,
# else 100 (above the manual builds; PrompTugal's last manual build is 6). Both jobs of one
# app use the same number. MARKETING_VERSION comes from the app's own project.
#
# Secrets: ASC_* and the certificate are shared. Profiles are per app:
#   IOS_PROFILE_<APP>_{APP,WIDGETS,INTENTS,SHARE}_BASE64, for example IOS_PROFILE_TEAM_APP_BASE64.
#   The app with bundle news.promptugal.reader also accepts the old IOS_PROFILE_{APP,WIDGETS,INTENTS}_BASE64.
# Setup: briefs/2026-11-08__overnight-push/release-setup.md

on:
  # A push to dev is released by website.yml ("Release and deploy"): it bumps VERSION, commits and
  # tags vX.Y.Z. This workflow follows it and builds THAT commit, so the app version is the tag.
  workflow_run:
    workflows: ['Release and deploy']
    types: [completed]
    branches: [dev]
  push:
    # Night branches are built by ios.yml; package one by hand with workflow_dispatch (+ source_ref).
    tags: ['ios-v*', 'team-v*', 'promptugal-v*', 'riskmandate-v*']
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app: all, or one'
        type: choice
        options: [all, team, promptugal, riskmandate]
        default: all
      upload:
        description: 'Sign and upload to TestFlight (needs the signing secrets)'
        type: boolean
        default: false
      signing:
        description: 'Signing: auto picks manual if the certificate secrets exist, else automatic'
        type: choice
        options: [auto, manual, automatic]
        default: auto
      build_number:
        description: 'Override CFBundleVersion (leave empty for run number + the app offset)'
        type: string
        default: ''
      dry_run:
        description: 'Sign and export the App Store .ipa, check profiles, but do not upload'
        type: boolean
        default: false
      internal_only:
        description: 'TestFlight internal testing only (build can never go to external testers or the App Store)'
        type: boolean
        default: false
      archive_signing:
        description: 'Automatic signing: how the archive is signed (codesign = unsigned archive, signed with codesign and its entitlements, no Apple Development certificate; development = old behaviour)'
        type: choice
        options: [codesign, distribution, adhoc, unsigned, development]
        default: codesign
      source_ref:
        description: 'Build another branch (e.g. night/platform) with these release scripts'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ios-release-${{ github.ref }}-${{ github.event_name }}
  # Never cancel a started run: dev gets merges every 15-30 min and an archive
  # takes ~8 min plus queue time, so cancel-in-progress left dev with no
  # finished build. With false, GitHub keeps one running and one waiting run
  # per group; a newer push replaces only the waiting one. Manual runs and
  # tags have their own group (event name), so pushes never touch them.
  cancel-in-progress: false

env:
  BUILD_NUMBER_OVERRIDE: ${{ inputs.build_number }}

jobs:
  changes:
    name: Changes
    # After a push to dev only when website.yml succeeded (it made the release commit and tag).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      actions: read   # the called workflow reads earlier runs
    uses: ./.github/workflows/ios-changes.yml
    with:
      app: ${{ inputs.app || 'all' }}
      upload: ${{ inputs.upload && 'true' || 'false' }}
      dry_run: ${{ inputs.dry_run && 'true' || 'false' }}
      source_ref: ${{ inputs.source_ref }}

  package:
    name: Unsigned archive (${{ matrix.app.app }})
    needs: changes
    if: needs.changes.outputs.has_apps == 'true'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read   # size check reads the latest dev build-info artifact
    env:
      PROJECT: ${{ matrix.app.project }}
      SCHEME: ${{ matrix.app.scheme }}
      APP_NAME: ${{ matrix.app.name }}
      APP_KEY: ${{ matrix.app.app }}
      EXPECTED_BUNDLE: ${{ matrix.app.bundle }}
      IOS_BUILD_OFFSET: ${{ matrix.app.offset }}
      SOURCE_SHA: ${{ needs.changes.outputs.ref }}   # build-info and file names carry the built commit
      NOTES_FROM: ${{ matrix.app.base }}             # release notes start at this app's last build
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.changes.outputs.ref }}   # the release commit after a push to dev; else the default
          fetch-depth: 0   # the app's build-info phase reads the commit count and tags

      - name: Use another branch's project (source_ref)
        if: inputs.source_ref != ''
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          git fetch --no-tags origin "$SOURCE_REF"
          git checkout --detach FETCH_HEAD
          git checkout "$GITHUB_SHA" -- scripts/release
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_REF=$SOURCE_REF" >> "$GITHUB_ENV"
          echo "**Source:** \`$SOURCE_REF\` at \`$(git rev-parse --short HEAD)\`, release scripts from \`${GITHUB_SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Select Xcode
        run: scripts/release/select-xcode.sh

      - name: Version and build number
        id: version
        run: scripts/release/version.sh

      - name: Archive and package (unsigned)
        run: scripts/release/package-unsigned.sh

      - name: Bundle id matches apps.json
        run: |
          built=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["app"])' "$RUNNER_TEMP/release/dist/build-info.json")
          if [ "$built" != "$EXPECTED_BUNDLE" ]; then
            # Only a warning here: the unsigned package uploads nowhere. The TestFlight job refuses to upload.
            echo "::warning::${APP_KEY}: the project builds $built but apps.json says $EXPECTED_BUNDLE. TestFlight will refuse to upload until they agree."
            echo "- ⚠️ \`$APP_KEY\`: project builds \`$built\`, apps.json says \`$EXPECTED_BUNDLE\`; TestFlight will not upload." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Size check
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/size-check.sh "$RUNNER_TEMP/release/dist/build-info.json"

      - name: Release notes
        if: always()
        run: |
          scripts/release/release-notes.sh > "$RUNNER_TEMP/release/dist/release-notes.txt"
          { echo; echo "### Release notes (from git log)"; echo; echo '```'; cat "$RUNNER_TEMP/release/dist/release-notes.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT_BASE }}-unsigned-ipa
          path: ${{ runner.temp }}/release/dist/${{ env.ARTIFACT_BASE }}-unsigned.ipa
          retention-days: 30
          compression-level: 0

      - name: Upload simulator app
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT_BASE }}-simulator-app
          path: ${{ runner.temp }}/release/dist/${{ env.ARTIFACT_BASE }}-simulator.app.zip
          retention-days: 30
          compression-level: 0

      - name: Upload .xcarchive
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT_BASE }}-xcarchive
          path: ${{ runner.temp }}/release/dist/${{ env.ARTIFACT_BASE }}.xcarchive.zip
          retention-days: 14
          compression-level: 0

      - name: Upload build-info.json
        uses: actions/upload-artifact@v5
        with:
          name: build-info-${{ matrix.app.app }}
          path: |
            ${{ runner.temp }}/release/dist/build-info.json
            ${{ runner.temp }}/release/dist/release-notes.txt
          retention-days: 90

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: release-logs-unsigned-${{ matrix.app.app }}
          path: ${{ runner.temp }}/release/logs/
          if-no-files-found: ignore
          retention-days: 14

  testflight:
    name: TestFlight (${{ matrix.app.app }})
    # Which apps upload is decided in the changes job: affected, testflight true, not paused
    # (pushes), or named by the tag or the manual run. A package that failed for one app does
    # not stop the others; the first step below checks this app's own package.
    needs: [changes, package]
    if: ${{ !cancelled() && needs.changes.outputs.has_upload == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.upload) }}
    runs-on: macos-26
    timeout-minutes: 60
    environment: testflight   # optional protection rules; secrets may live here or at repo level
    permissions:
      contents: read
      actions: read   # to see this run's artifacts
    env:
      PROJECT: ${{ matrix.app.project }}
      SCHEME: ${{ matrix.app.scheme }}
      APP_NAME: ${{ matrix.app.name }}
      APP_KEY: ${{ matrix.app.app }}
      EXPECTED_BUNDLE: ${{ matrix.app.bundle }}
      BUNDLE_ID: ${{ matrix.app.bundle }}   # asc.py looks the record up by this
      IOS_BUILD_OFFSET: ${{ matrix.app.offset }}
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ needs.changes.outputs.ref }}
      NOTES_FROM: ${{ matrix.app.base }}
      # Only the presence of these is checked in the gate step; values never print.
      IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
      IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      IOS_PROFILE_APP_BASE64: ${{ secrets[format('IOS_PROFILE_{0}_APP_BASE64', matrix.app.secret)] || (matrix.app.legacy && secrets.IOS_PROFILE_APP_BASE64) || '' }}
      IOS_PROFILE_WIDGETS_BASE64: ${{ secrets[format('IOS_PROFILE_{0}_WIDGETS_BASE64', matrix.app.secret)] || (matrix.app.legacy && secrets.IOS_PROFILE_WIDGETS_BASE64) || '' }}
      IOS_PROFILE_INTENTS_BASE64: ${{ secrets[format('IOS_PROFILE_{0}_INTENTS_BASE64', matrix.app.secret)] || (matrix.app.legacy && secrets.IOS_PROFILE_INTENTS_BASE64) || '' }}
      IOS_PROFILE_SHARE_BASE64: ${{ secrets[format('IOS_PROFILE_{0}_SHARE_BASE64', matrix.app.secret)] || (matrix.app.legacy && secrets.IOS_PROFILE_SHARE_BASE64) || '' }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
      SIGNING: ${{ inputs.signing || 'auto' }}
      INTERNAL_ONLY: ${{ inputs.internal_only && 'true' || 'false' }}
      SKIP_UPLOAD: ${{ inputs.dry_run && 'true' || 'false' }}
    steps:
      - name: Check signing secrets
        id: gate
        run: |
          # The script lives in the repo, but this step must work before checkout
          # is useful, so it only reads which variables are non-empty.
          missing=()
          [ -n "$ASC_KEY_ID" ]        || missing+=(ASC_KEY_ID)
          [ -n "$ASC_ISSUER_ID" ]     || missing+=(ASC_ISSUER_ID)
          [ -n "$ASC_KEY_P8_BASE64" ] || missing+=(ASC_KEY_P8_BASE64)
          cert_missing=()
          [ -n "$IOS_DIST_CERT_P12_BASE64" ] || cert_missing+=(IOS_DIST_CERT_P12_BASE64)
          [ -n "$IOS_DIST_CERT_PASSWORD" ]   || cert_missing+=(IOS_DIST_CERT_PASSWORD)
          [ -n "$IOS_PROFILE_APP_BASE64" ]   || cert_missing+=(IOS_PROFILE_APP_BASE64)
          mode=$SIGNING
          if [ "$mode" = auto ]; then
            if [ ${#cert_missing[@]} -eq 0 ]; then mode=manual; else mode=automatic; fi
          fi
          [ "$mode" = manual ] && missing+=("${cert_missing[@]}")
          [ "$mode" = automatic ] && [ -z "$APPLE_TEAM_ID" ] && missing+=(APPLE_TEAM_ID)
          echo "## TestFlight: $APP_KEY (\`$EXPECTED_BUNDLE\`)" >> "$GITHUB_STEP_SUMMARY"
          # This app's unsigned package must have succeeded in this run (its build-info is the last upload).
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --jq '.artifacts[].name' | grep -qx "build-info-$APP_KEY"; then
            echo "skipped: the unsigned package of $APP_KEY did not succeed in this run"
            echo "- ⏭️ skipped: the unsigned package of \`$APP_KEY\` did not succeed in this run" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"; echo "mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            for s in "${missing[@]}"; do
              echo "skipped: secret $s missing"
              echo "- ⏭️ skipped: secret \`$s\` missing" >> "$GITHUB_STEP_SUMMARY"
            done
            echo "" >> "$GITHUB_STEP_SUMMARY"
            if [ "$mode" = automatic ] && [ ${#cert_missing[@]} -gt 0 ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "For manual signing (the default once present) add instead of \`APPLE_TEAM_ID\`: $(printf '\`%s\` ' "${cert_missing[@]}")and the extension profiles of this app (see release-setup.md)." >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "Nothing was signed or uploaded (signing mode \`$mode\`). Add the secrets listed in \`briefs/2026-11-08__overnight-push/release-setup.md\`, then run this workflow again with **upload** ticked." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "Signing mode: $mode. All secrets for it are present."
            echo "Signing mode: \`$mode\`. All secrets for it are present." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          ref: ${{ needs.changes.outputs.ref }}
          fetch-depth: 0

      - name: Use another branch's project (source_ref)
        if: steps.gate.outputs.ready == 'true' && inputs.source_ref != ''
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          git fetch --no-tags origin "$SOURCE_REF"
          git checkout --detach FETCH_HEAD
          git checkout "$GITHUB_SHA" -- scripts/release
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_REF=$SOURCE_REF" >> "$GITHUB_ENV"
          echo "**Source:** \`$SOURCE_REF\` at \`$(git rev-parse --short HEAD)\`, release scripts from \`${GITHUB_SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Select Xcode
        if: steps.gate.outputs.ready == 'true'
        run: scripts/release/select-xcode.sh

      - name: Version and build number
        if: steps.gate.outputs.ready == 'true'
        run: scripts/release/version.sh

      - name: Install certificate, profiles and API key
        if: steps.gate.outputs.ready == 'true'
        env:
          MODE: ${{ steps.gate.outputs.mode }}
        run: scripts/release/signing-setup.sh

      - name: App Store Connect record exists?
        # An app without a record (Team, RiskMandate, until Dinis creates them) is skipped, green,
        # before the expensive archive. A dry run does not upload, so it goes on.
        if: steps.gate.outputs.ready == 'true' && env.SKIP_UPLOAD != 'true'
        run: |
          rc=0
          python3 scripts/release/asc.py has-record || rc=$?
          if [ "$rc" = 3 ]; then
            echo "RECORD_MISSING=true" >> "$GITHUB_ENV"
            echo "- ⏭️ skipped: no App Store Connect record for \`$EXPECTED_BUNDLE\`. Create it by hand; nothing was archived or uploaded." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$rc" != 0 ]; then
            exit "$rc"
          fi

      - name: Archive, sign, export and upload
        if: steps.gate.outputs.ready == 'true' && env.RECORD_MISSING != 'true'
        env:
          MODE: ${{ steps.gate.outputs.mode }}
          AUTO_ARCHIVE: ${{ inputs.archive_signing || 'codesign' }}
        run: scripts/release/testflight.sh

      - name: Wait for processing, answer export compliance, set What to Test
        if: steps.gate.outputs.ready == 'true' && env.SKIP_UPLOAD != 'true' && env.RECORD_MISSING != 'true'
        continue-on-error: true   # the upload is done; these are conveniences
        run: |
          scripts/release/release-notes.sh > "$RUNNER_TEMP/release/notes.txt"
          python3 scripts/release/asc.py wait-build --version "$MARKETING_VERSION" --build "$BUILD_NUMBER" --timeout 1200
          python3 scripts/release/asc.py compliance --version "$MARKETING_VERSION" --build "$BUILD_NUMBER"
          python3 scripts/release/asc.py whats-new  --version "$MARKETING_VERSION" --build "$BUILD_NUMBER" --file "$RUNNER_TEMP/release/notes.txt"

      - name: Upload signed .ipa
        if: steps.gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT_BASE }}-appstore-ipa
          path: ${{ runner.temp }}/release/export/*.ipa
          if-no-files-found: ignore
          retention-days: 30
          compression-level: 0

      - name: Upload logs
        if: always() && steps.gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: release-logs-testflight-${{ matrix.app.app }}
          path: ${{ runner.temp }}/release/logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove keychain, profiles and key
        if: always() && steps.gate.outputs.ready == 'true'
        run: scripts/release/signing-cleanup.sh
