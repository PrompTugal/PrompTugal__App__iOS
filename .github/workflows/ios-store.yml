name: iOS App Store listing

# Sets the App Store name, subtitle, descriptions, keywords, URLs and what's new, per locale, from review's
# store/listing.json (generated by make_listing_json.py). Metadata only: no build, no screenshots, no
# submission. By hand only. Without "confirm" it is a dry run: it reads App Store Connect and prints a table
# of what would change. Nothing changes in App Store Connect without the conductor's go.

on:
  workflow_dispatch:
    inputs:
      listing_ref:
        description: 'Branch or commit that holds the listing file (review keeps it on split/review)'
        type: string
        default: 'split/review'
      listing_path:
        description: 'Path of listing.json in that ref'
        type: string
        default: 'briefs/2026-11-08__summit-app-store/store/listing.json'
      version:
        description: 'App Store version to fill (empty = the editable one)'
        type: string
        default: ''
      confirm:
        description: 'Really apply the changes (otherwise a dry run)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-store
  cancel-in-progress: false

jobs:
  listing:
    name: App Store listing (${{ inputs.confirm && 'apply' || 'dry run' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: testflight   # secrets may live here or at repo level
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.listing_ref }}
          path: listing-src

      - name: Check secrets
        id: gate
        run: |
          missing=0
          for s in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!s}" ]; then echo "skipped: secret $s missing"; echo "- ⏭️ skipped: secret \`$s\` missing" >> "$GITHUB_STEP_SUMMARY"; missing=1; fi
          done
          echo "ready=$([ $missing = 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Listing file
        run: |
          f="listing-src/${{ inputs.listing_path }}"
          test -f "$f" || { echo "::error::no $f"; exit 1; }
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print('locales:', ', '.join(d['locales']))" "$f"
          echo "- Listing from \`${{ inputs.listing_ref }}\` ($(git -C listing-src rev-parse --short HEAD)), \`${{ inputs.listing_path }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Store metadata
        if: steps.gate.outputs.ready == 'true'
        run: python3 scripts/release/asc.py store-metadata --listing "listing-src/${{ inputs.listing_path }}" --version "${{ inputs.version }}" ${{ inputs.confirm && '--yes' || '' }}
