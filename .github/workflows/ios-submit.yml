name: iOS App Store submit

# Submits a build that is already in App Store Connect (uploaded by
# "iOS release") for App Store review. By hand only. Metadata, screenshots,
# pricing and the privacy questions stay manual in App Store Connect.
# Without "confirm" it only prints the plan.

# action=store-metadata fills the App Store listing (name, subtitle, descriptions, keywords, URLs, what's new,
# per locale) from review's store/listing.json instead of submitting: metadata only, no build, no screenshots,
# no submission; a dry run unless "confirm". Nothing changes in App Store Connect without the conductor's go.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'submit = submit a build for App Review; store-metadata = fill the App Store listing'
        type: choice
        options: [submit, store-metadata, store-screenshots, age-rating]
        default: submit
      version:
        description: 'submit: version, e.g. 0.3.1 (CFBundleShortVersionString). store-metadata: the App Store version to fill (empty = the editable one)'
        required: false
        default: ''
        type: string
      build:
        description: 'submit only: build number, e.g. 142 (see the iOS release run)'
        required: false
        default: ''
        type: string
      confirm:
        description: 'Really submit for review / apply the listing (otherwise a dry run)'
        type: boolean
        default: false
      listing_ref:
        description: 'store-metadata: branch or commit that holds the listing file (review keeps it on split/review)'
        type: string
        default: 'split/review'
      listing_path:
        description: 'store-metadata: path of listing.json in that ref (review-notes.txt is read from the same folder)'
        type: string
        default: 'briefs/2026-11-08__summit-app-store/store/listing.json'
      screens_run:
        description: 'store-screenshots: id of the Screens run whose artifact appstore-screens-<sha>-promptugal to upload'
        type: string
        default: ''
      screens_ids:
        description: 'store-screenshots: screen ids to upload, in store order (their position becomes 01, 02, ...)'
        type: string
        default: '01-now,02-team.schedule,03-explore,06-explore.people'
      age_set:
        description: 'age-rating: field=value pairs, space-separated (empty = only show the declaration)'
        type: string
        default: ''
      release_type:
        description: 'store-metadata: how the approved version goes live: after_approval (automatic), manual, or empty = leave as is'
        type: choice
        options: ['', after_approval, manual]
        default: ''
      set_version_string:
        description: 'store-metadata: change the App Store version string to this (the build version, e.g. 0.4.31). Empty = leave it.'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ios-submit
  cancel-in-progress: false

jobs:
  submit:
    name: Submit for App Review
    if: inputs.action == 'submit'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: app-store
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      VERSION: ${{ inputs.version }}
      BUILD: ${{ inputs.build }}
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        id: gate
        run: |
          missing=0
          for s in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!s}" ]; then echo "skipped: secret $s missing"; echo "- ⏭️ skipped: secret \`$s\` missing" >> "$GITHUB_STEP_SUMMARY"; missing=1; fi
          done
          echo "ready=$([ $missing = 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Wait for the build to be processed
        if: steps.gate.outputs.ready == 'true'
        run: python3 scripts/release/asc.py wait-build --version "$VERSION" --build "$BUILD" --timeout 1800

      - name: Export compliance
        if: steps.gate.outputs.ready == 'true'
        run: python3 scripts/release/asc.py compliance --version "$VERSION" --build "$BUILD"

      - name: Submit
        if: steps.gate.outputs.ready == 'true'
        run: python3 scripts/release/asc.py submit --version "$VERSION" --build "$BUILD" ${{ inputs.confirm && '--yes' || '' }}

  listing:
    name: App Store listing (${{ inputs.confirm && 'apply' || 'dry run' }})
    if: inputs.action == 'store-metadata'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: testflight   # the ASC secrets live here or at repo level, as for iOS release
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      # App Review contact and the demo key for the notes: secrets only (public repository), never printed.
      REVIEW_CONTACT_FIRST_NAME: ${{ secrets.REVIEW_CONTACT_FIRST_NAME }}
      REVIEW_CONTACT_LAST_NAME: ${{ secrets.REVIEW_CONTACT_LAST_NAME }}
      REVIEW_CONTACT_EMAIL: ${{ secrets.REVIEW_CONTACT_EMAIL }}
      REVIEW_CONTACT_PHONE: ${{ secrets.REVIEW_CONTACT_PHONE }}
      DEMO_OPENROUTER_KEY: ${{ secrets.DEMO_OPENROUTER_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.listing_ref }}
          path: listing-src

      - name: Check secrets
        id: gate
        run: |
          missing=0
          for s in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!s}" ]; then echo "skipped: secret $s missing"; echo "- ⏭️ skipped: secret \`$s\` missing" >> "$GITHUB_STEP_SUMMARY"; missing=1; fi
          done
          echo "ready=$([ $missing = 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Listing file
        run: |
          f="listing-src/${{ inputs.listing_path }}"
          test -f "$f" || { echo "::error::no $f"; exit 1; }
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print('locales:', ', '.join(d['locales']))" "$f"
          echo "- Listing from \`${{ inputs.listing_ref }}\` ($(git -C listing-src rev-parse --short HEAD)), \`${{ inputs.listing_path }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Store metadata
        if: steps.gate.outputs.ready == 'true'
        env:
          LISTING: listing-src/${{ inputs.listing_path }}
          VERSION_STRING: ${{ inputs.set_version_string }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          # The app's primary locale is en-GB: it gets the en-US texts. What's New is not accepted on a
          # first version. Content rights and categories as decided (store/README.md, age-rating.md).
          args=(--listing "$LISTING" --version "${{ inputs.version }}"
                --also en-GB=en-US --skip whatsNew
                --content-rights USES_THIRD_PARTY_CONTENT --categories NEWS,BUSINESS
                --review-notes "$(dirname "$LISTING")/review-notes.txt")
          [ -n "$VERSION_STRING" ] && args+=(--set-version-string "$VERSION_STRING")
          [ -n "$RELEASE_TYPE" ] && args+=(--release-type "$RELEASE_TYPE")
          python3 scripts/release/asc.py store-metadata "${args[@]}" ${{ inputs.confirm && '--yes' || '' }}

  extras:
    name: ${{ inputs.action }} (${{ inputs.confirm && 'apply' || 'dry run' }})
    if: inputs.action == 'store-screenshots' || inputs.action == 'age-rating'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: testflight
    permissions:
      contents: read
      actions: read   # download the screenshots artifact of another run
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - name: Download the screenshots
        if: inputs.action == 'store-screenshots'
        uses: actions/download-artifact@v5
        with:
          run-id: ${{ inputs.screens_run }}
          github-token: ${{ github.token }}
          pattern: appstore-screens-*-promptugal
          merge-multiple: true
          path: shots

      - name: Run
        env:
          AGE_SET: ${{ inputs.age_set }}
          IDS: ${{ inputs.screens_ids }}
          VERSION_NAME: ${{ inputs.version }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8_BASE64" ]; then
            echo "- ⏭️ skipped: ASC secrets missing" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          yes_flag=${{ inputs.confirm && '--yes' || '' }}
          if [ "${{ inputs.action }}" = store-screenshots ]; then
            find shots -maxdepth 3 | head -20
            python3 scripts/release/asc.py store-screenshots --dir shots --ids "$IDS" --also en-GB=en-US --version "$VERSION_NAME" $yes_flag
          else
            args=(); for kv in $AGE_SET; do args+=(--set "$kv"); done
            python3 scripts/release/asc.py age-rating "${args[@]}" $yes_flag
          fi
