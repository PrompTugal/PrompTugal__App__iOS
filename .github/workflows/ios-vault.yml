name: iOS vault

# Interim CI for the Swift vault package, owned by the vault session.
# The platform session's .github/workflows/ios.yml runs the same `swift test`
# once it reaches dev; this file can then be deleted.

on:
  push:
    branches: [night/vault]
    paths:
      - 'Packages/SGitVault/**'
      - 'PrompTugal/Vault/**'
      - '.github/workflows/ios-vault.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-vault-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-test:
    name: SGitVault swift test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: swift test
        working-directory: Packages/SGitVault
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          if swift test 2>&1 | tee "$RUNNER_TEMP/logs/swift-test.log"; then
            echo "### ✅ SGitVault swift test passed" >> "$GITHUB_STEP_SUMMARY"
            grep -E "Executed [0-9]+ tests" "$RUNNER_TEMP/logs/swift-test.log" | tail -1 >> "$GITHUB_STEP_SUMMARY" || true
          else
            {
              echo "### ❌ SGitVault swift test failed"
              echo '```'
              grep -E "error:|failed|XCTAssert|Fatal" "$RUNNER_TEMP/logs/swift-test.log" | head -80
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-test-log
          path: ${{ runner.temp }}/logs/
          if-no-files-found: ignore

  reference-reader:
    name: Fixtures read by the Python reference reader
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install cryptography
      - run: python3 -I Packages/SGitVault/Tests/Fixtures/reference_reader.py Packages/SGitVault/Tests/Fixtures
