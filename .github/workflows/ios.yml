name: iOS

# CI is the compiler: nobody in the overnight push can build Swift on Linux.
# Every job copies compiler and test errors into its job summary, so a session
# can read a failure through the GitHub tools (actions_list, get_job_logs).
#
# Only what a change touches is built (contracts section 5). The `changes` job
# (ubuntu, ios-changes.yml) reads apps.json and the diff, then ONE macOS job does
# all of it (briefs/2026-11-10__ci-on-one-mac):
#
#   mac       per affected app: build once, unit tests on an iPhone and an iPad simulator
#             (dev, pull requests and workflow_dispatch; night/** pushes build only), the
#             Release build for a device (unsigned); then each affected package's tests
#   quick     manual runs only: Debug build and iPhone tests, no Release build, no iPad
#   result    one stable check name that is green when everything above is
#
# An app whose project does not exist yet is skipped, with a line in the summary.
# Before apps.json exists, the built-in config builds today's single app.
#
# Pushes that change only briefs/, website/, root Markdown or VERSION don't run
# it: macOS runners are shared by every session, and those files can't break
# the app. (A .md file inside PrompTugal/ can, so those still run.)

on:
  push:
    branches: [dev, 'night/**']
    paths: ['**', '!briefs/**', '!website/**', '!*.md', '!VERSION']
  pull_request:
    paths: ['**', '!briefs/**', '!website/**', '!*.md', '!VERSION']
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to build and test'
        type: choice
        options: [all, team, promptugal, riskmandate, fringe]
        default: all
      quick:
        description: 'Quick: Debug build and iPhone unit tests of the app, plus the package tests of what the branch changed. No Release build, no iPad. Run once with quick off before a merge to dev.'
        type: boolean
        default: false
      runner:
        description: 'macOS runner for the build, test and package jobs. macos-26 = GitHub-hosted, self-hosted = the Mac registered to this repository, auto = self-hosted when a self-hosted runner is online, else macos-26'
        type: choice
        options: [macos-26, self-hosted, auto]
        default: macos-26

permissions:
  contents: read

# Concurrency is per job, not per run. A job that has started always finishes;
# a job still waiting for a runner is replaced by the same job of a newer push.

jobs:
  # Which runner the macOS jobs use. Pushes and pull requests: macos-26. Manual runs: the input;
  # auto asks the API whether a self-hosted runner is online. Listing a repository's runners needs
  # an administration-read token (secret RUNNER_PROBE_TOKEN); the workflow's own token cannot do
  # it, so without that secret, or if the call fails for any reason, auto means macos-26.
  pick-runner:
    name: Pick the runner
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        env:
          WANT: ${{ inputs.runner || 'macos-26' }}
          GH_TOKEN: ${{ secrets.RUNNER_PROBE_TOKEN || github.token }}
          HAVE_PROBE_TOKEN: ${{ secrets.RUNNER_PROBE_TOKEN != '' }}
        run: |
          runner=$WANT
          if [ "$WANT" = auto ]; then
            runner=macos-26
            online=$(gh api "repos/$GITHUB_REPOSITORY/actions/runners" --jq '[.runners[] | select(.status=="online")] | length' 2>/dev/null || echo "")
            if [ -n "$online" ] && [ "$online" -gt 0 ]; then runner=self-hosted; fi
            echo "auto: online self-hosted runners=${online:-unknown} (probe token set: $HAVE_PROBE_TOKEN) -> $runner"
            echo "- Runner **$runner** (auto: online self-hosted runners: ${online:-unknown}; probe token set: $HAVE_PROBE_TOKEN)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

  # Cheap Ubuntu check so a night or split branch that only merged dev costs no macOS runner:
  # on a push to night/** or split/**, if the pushed commit is already in origin/dev, dev's own
  # run covers it and the macOS jobs are skipped.
  gate:
    name: Already on dev?
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: check
        run: |
          run=true
          if [ "${{ github.event_name }}" = push ] && [[ "${{ github.ref }}" == refs/heads/night/* || "${{ github.ref }}" == refs/heads/split/* ]]; then
            git fetch --quiet origin dev
            if git merge-base --is-ancestor "$GITHUB_SHA" origin/dev; then
              run=false
              echo "### ⏭️ $GITHUB_SHA is already on dev; dev's run covers it, macOS jobs skipped" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "run=$run"

  changes:
    name: Changes
    permissions:
      contents: read
      actions: read   # the called workflow reads earlier runs
    uses: ./.github/workflows/ios-changes.yml
    with:
      app: ${{ inputs.app || 'all' }}

  # Platform's test (contracts section 4). A job of its own, so a bad apps.json turns the
  # run red without stopping the builds that the plan already chose.
  check-apps:
    name: apps.json matches the projects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: check_apps.py
        run: |
          set -e
          if [ -f scripts/apps/check_apps.py ]; then
            python3 scripts/apps/check_apps.py
            [ -f scripts/apps/test_apps.py ] && python3 scripts/apps/test_apps.py
          else
            echo "scripts/apps/check_apps.py is not on this ref yet; skipped."
            echo "- ⏭️ check_apps.py: not on this ref yet, skipped" >> "$GITHUB_STEP_SUMMARY"
          fi

  # All the Mac work of a run, in ONE job (briefs/2026-11-10__ci-on-one-mac): the account has
  # 5 macOS runners for every repository and session, and a job per app, device, configuration
  # and package (a median of 10 per dev push) spent three times longer queueing than running.
  # One job queues once, selects Xcode once, boots one iPhone and one iPad simulator and builds
  # each app once for both devices. What it checks has not changed:
  #
  #   build        per app: build-for-testing (Debug, iOS Simulator), or a Debug build only on
  #                night/** pushes as before; the Release build for a device (unsigned) and
  #                check-embedded.sh; each affected package's tests built in one DerivedData
  #                (PTCore compiles once). No simulator runs while compiling.
  #   test         then the iPhone simulator: every app's and package's tests; then the iPad
  #                simulator: every app's tests (test-without-building, the same test bundles)
  #
  #   publish      on a push to dev, once everything above is green: each affected app with
  #                "testflight": true (and not paused) is archived from the push's release commit,
  #                signed and uploaded to TestFlight (internal testers). No step on main for now
  #                (Dinis, 10 Nov). The App Store submission stays manual: ios-submit.yml.
  #
  # quick (manual): Debug and iPhone tests only, no Release build, no iPad.
  # One app's failure does not stop the others; the job lists every failure and fails.
  mac:
    name: 'macOS: build, test and publish'
    needs: [gate, changes, pick-runner]
    if: needs.gate.outputs.run == 'true' && (needs.changes.outputs.has_apps == 'true' || needs.changes.outputs.has_packages == 'true')
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    # One running and one waiting per branch; a newer push replaces the waiting one. A started
    # job always finishes.
    concurrency:
      group: ios-mac-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 150
    # The signing secrets may live in the testflight environment. Only a dev push uses it; any
    # other run has no environment and no secrets.
    environment: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/dev') && 'testflight' || '' }}
    permissions:
      contents: read
      actions: read   # size check and plan read earlier runs
    outputs:
      uploaded: ${{ steps.publish.outputs.uploaded }}
    env:
      APPS_JSON: ${{ needs.changes.outputs.apps }}
      PACKAGES_JSON: ${{ needs.changes.outputs.packages }}
      UPLOAD_JSON: ${{ needs.changes.outputs.upload }}
      PUBLISH: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.changes.outputs.has_upload == 'true') && 'true' || 'false' }}
      # Unit tests on dev, pull requests and manual runs; night/** and split/** pushes build only.
      RUN_TESTS: ${{ (github.ref == 'refs/heads/dev' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && 'true' || 'false' }}
      DEVICES: ${{ inputs.quick && 'iPhone' || 'iPhone iPad' }}
      RELEASE_BUILD: ${{ inputs.quick && 'false' || 'true' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # build info needs the commit count and tags

      - name: Select Xcode
        run: .github/scripts/select-xcode.sh

      # All builds first with no simulator running, then one simulator at a time (mac-job.sh).
      - name: Build the apps and packages
        run: .github/scripts/mac-job.sh build

      - name: Tests on the iPhone simulator
        if: ${{ !cancelled() && (env.RUN_TESTS == 'true' || needs.changes.outputs.has_packages == 'true') }}
        timeout-minutes: 60
        run: .github/scripts/mac-job.sh test iPhone

      - name: Tests on the iPad simulator
        if: ${{ !cancelled() && env.RUN_TESTS == 'true' && !inputs.quick }}
        timeout-minutes: 60
        run: .github/scripts/mac-job.sh test iPad

      # The app version is the v* tag that website.yml puts on this push's release commit (VERSION
      # bumped, nothing else). Built after the tests, so the tag is normally there already.
      - name: Find this push's release commit
        id: release
        if: success() && env.PUBLISH == 'true'
        timeout-minutes: 8
        run: |
          found=""
          for i in $(seq 1 30); do
            git fetch --quiet --force --tags origin dev
            for tag in $(git tag --list 'v[0-9]*' --sort=-version:refname | head -20); do
              c=$(git rev-parse "$tag^{commit}")
              if [ "$(git rev-parse "$c^")" = "$GITHUB_SHA" ]; then found="$tag $c"; break 2; fi
            done
            # website.yml finished without a tag for this commit: a later push took the release.
            st=$(gh run list --workflow website.yml --commit "$GITHUB_SHA" --json status -q '.[0].status' 2>/dev/null || true)
            [ "$st" = completed ] && [ "$i" -gt 2 ] && break
            sleep 15
          done
          if [ -z "$found" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### ⏭️ No release commit for \`${GITHUB_SHA:0:7}\` (a later push took it). Built and tested; that push's run uploads." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          read -r tag commit <<< "$found"
          diff=$(git diff --name-only "$GITHUB_SHA" "$commit")
          if [ "$diff" != VERSION ]; then
            echo "::error::release commit $commit changes more than VERSION: $diff"; exit 1
          fi
          git checkout --quiet --detach "$commit"
          echo "SOURCE_SHA=$commit" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "### Release $tag (\`${commit:0:7}\`, VERSION bump on \`${GITHUB_SHA:0:7}\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Release build (no release commit, so no upload)
        if: success() && steps.release.outputs.ready == 'false'
        env:
          RELEASE_APPS: ${{ needs.changes.outputs.upload }}
        run: .github/scripts/mac-job.sh release

      - name: Sign, export and upload to TestFlight
        id: publish
        if: success() && steps.release.outputs.ready == 'true'
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROFILE_TEAM_APP_BASE64: ${{ secrets.IOS_PROFILE_TEAM_APP_BASE64 }}
          IOS_PROFILE_TEAM_WIDGETS_BASE64: ${{ secrets.IOS_PROFILE_TEAM_WIDGETS_BASE64 }}
          IOS_PROFILE_TEAM_INTENTS_BASE64: ${{ secrets.IOS_PROFILE_TEAM_INTENTS_BASE64 }}
          IOS_PROFILE_TEAM_SHARE_BASE64: ${{ secrets.IOS_PROFILE_TEAM_SHARE_BASE64 }}
          IOS_PROFILE_PROMPTUGAL_APP_BASE64: ${{ secrets.IOS_PROFILE_PROMPTUGAL_APP_BASE64 }}
          IOS_PROFILE_PROMPTUGAL_WIDGETS_BASE64: ${{ secrets.IOS_PROFILE_PROMPTUGAL_WIDGETS_BASE64 }}
          IOS_PROFILE_PROMPTUGAL_INTENTS_BASE64: ${{ secrets.IOS_PROFILE_PROMPTUGAL_INTENTS_BASE64 }}
          IOS_PROFILE_PROMPTUGAL_SHARE_BASE64: ${{ secrets.IOS_PROFILE_PROMPTUGAL_SHARE_BASE64 }}
          IOS_PROFILE_RISKMANDATE_APP_BASE64: ${{ secrets.IOS_PROFILE_RISKMANDATE_APP_BASE64 }}
          IOS_PROFILE_RISKMANDATE_WIDGETS_BASE64: ${{ secrets.IOS_PROFILE_RISKMANDATE_WIDGETS_BASE64 }}
          IOS_PROFILE_RISKMANDATE_INTENTS_BASE64: ${{ secrets.IOS_PROFILE_RISKMANDATE_INTENTS_BASE64 }}
          IOS_PROFILE_RISKMANDATE_SHARE_BASE64: ${{ secrets.IOS_PROFILE_RISKMANDATE_SHARE_BASE64 }}
          # Fringe signs automatically (the API key makes its App ID and profile) unless this secret is set.
          IOS_PROFILE_FRINGE_APP_BASE64: ${{ secrets.IOS_PROFILE_FRINGE_APP_BASE64 }}
          IOS_PROFILE_FRINGE_WIDGETS_BASE64: ${{ secrets.IOS_PROFILE_FRINGE_WIDGETS_BASE64 }}
          IOS_PROFILE_FRINGE_INTENTS_BASE64: ${{ secrets.IOS_PROFILE_FRINGE_INTENTS_BASE64 }}
          IOS_PROFILE_FRINGE_SHARE_BASE64: ${{ secrets.IOS_PROFILE_FRINGE_SHARE_BASE64 }}
          # The old unprefixed names belong to the app with the legacy bundle (news.promptugal.reader).
          LEGACY_PROFILE_APP_BASE64: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
          LEGACY_PROFILE_WIDGETS_BASE64: ${{ secrets.IOS_PROFILE_WIDGETS_BASE64 }}
          LEGACY_PROFILE_INTENTS_BASE64: ${{ secrets.IOS_PROFILE_INTENTS_BASE64 }}
          LEGACY_PROFILE_SHARE_BASE64: ${{ secrets.IOS_PROFILE_SHARE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
          # Not internal-only: the internal group gets every build with no review, and ios-submit.yml
          # (manual) can still send a chosen build to App Store review.
          INTERNAL_ONLY: 'false'
          AUTO_ARCHIVE: codesign
        run: .github/scripts/mac-job.sh publish

      - name: Remove keychain, profiles and key
        if: always() && steps.release.outputs.ready == 'true'
        run: |
          for d in "$RUNNER_TEMP"/release/*/; do
            [ -d "$d" ] || continue
            OUT=${d%/} PROJECT=x SCHEME=x scripts/release/signing-cleanup.sh || true
          done

      - name: Upload build-info and release notes
        if: always() && steps.publish.outcome != 'skipped'
        uses: actions/upload-artifact@v5
        with:
          name: build-info-apps
          path: |
            ${{ runner.temp }}/publish/*/build-info.json
            ${{ runner.temp }}/publish/*/release-notes.txt
            ${{ runner.temp }}/publish/*/uploaded.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload signed .ipa files
        if: always() && steps.publish.outcome != 'skipped'
        uses: actions/upload-artifact@v5
        with:
          name: appstore-ipas
          path: ${{ runner.temp }}/publish/*/*.ipa
          if-no-files-found: ignore
          retention-days: 30
          compression-level: 0

      - name: Delete the simulators (self-hosted only)
        if: always() && runner.environment == 'self-hosted'
        run: |
          [ -f "$RUNNER_TEMP/sims.env" ] || exit 0
          cut -d= -f2 "$RUNNER_TEMP/sims.env" | while read -r u; do
            xcrun simctl shutdown "$u" 2>/dev/null || true
            xcrun simctl delete "$u" || true
          done

      - name: Upload logs and test results (failures only)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: mac-logs
          path: |
            ${{ runner.temp }}/logs/
            ${{ runner.temp }}/release/*/logs/
          if-no-files-found: ignore
          retention-days: 14

  # After an upload: wait for App Store Connect to process each build, answer export compliance
  # and set What to Test. Ubuntu (asc.py is Python and openssl), so no Mac waits on Apple.
  # Conveniences, as before: the upload is done, so this job never turns the run red.
  testflight-processing:
    name: TestFlight processing
    needs: mac
    if: ${{ !cancelled() && needs.mac.outputs.uploaded != '' && needs.mac.outputs.uploaded != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    environment: testflight
    permissions:
      contents: read
      actions: read
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      UPLOADED: ${{ needs.mac.outputs.uploaded }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/release

      - uses: actions/download-artifact@v5
        with:
          name: build-info-apps
          path: ${{ runner.temp }}/publish

      - name: Wait for processing, answer export compliance, set What to Test
        run: |
          set -u   # asc.py signs its token from ASC_KEY_P8_BASE64 and writes no key file
          rc=0
          for row in $(echo "$UPLOADED" | python3 -c 'import json,sys; [print("%s|%s|%s|%s" % (e["app"], e["bundle"], e["version"], e["build"])) for e in json.load(sys.stdin)]'); do
            IFS='|' read -r key bundle version build <<< "$row"
            echo "== $key ($bundle) $version ($build)"
            echo "## \`$key\`: $version ($build)" >> "$GITHUB_STEP_SUMMARY"
            export BUNDLE_ID=$bundle
            notes=$RUNNER_TEMP/publish/$key/release-notes.txt
            python3 scripts/release/asc.py wait-build --version "$version" --build "$build" --timeout 1200 \
              && python3 scripts/release/asc.py compliance --version "$version" --build "$build" \
              && python3 scripts/release/asc.py whats-new --version "$version" --build "$build" --file "$notes" \
              && echo "- ✅ processed, compliance answered, What to Test set" >> "$GITHUB_STEP_SUMMARY" \
              || { rc=1; echo "- ⚠️ processing steps did not all finish; see the log" >> "$GITHUB_STEP_SUMMARY"; }
          done
          exit $rc

  # One check name that does not change with the matrix: green when every job that ran is
  # green (skipped jobs do not count against it). Branch protection can require this one.
  result:
    name: iOS result
    if: always()
    needs: [gate, changes, check-apps, mac]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}' | python3 -c '
          import json, sys
          bad = {k: v["result"] for k, v in json.load(sys.stdin).items() if v["result"] in ("failure", "cancelled")}
          print("failed:", bad or "none")
          sys.exit(1 if bad else 0)'
