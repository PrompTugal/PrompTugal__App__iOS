name: iOS

# CI is the compiler: nobody in the overnight push can build Swift on Linux.
# Every job copies compiler and test errors into its job summary, so a session
# can read a failure through the GitHub tools (actions_list, get_job_logs).
#
#   build    xcodebuild build for the iOS Simulator, unsigned, then swift test in
#            Packages/SGitVault on the same runner (skipped if the folder is missing)
#   test     xcodebuild test on an iPhone and an iPad simulator: dev, pull requests
#            and workflow_dispatch only (night/** pushes get the build job alone)
#
# Pushes that change only briefs/, website/, root Markdown or VERSION don't run
# it: macOS runners are shared by every session, and those files can't break
# the app. (A .md file inside PrompTugal/ can, so those still run.)

on:
  push:
    branches: [dev, 'night/**']
    paths: ['**', '!briefs/**', '!website/**', '!*.md', '!VERSION']
  pull_request:
    paths: ['**', '!briefs/**', '!website/**', '!*.md', '!VERSION']
  workflow_dispatch:

permissions:
  contents: read

# Concurrency is per job, not per run. A job that has started always finishes;
# a job still waiting for a runner is replaced by the same job of a newer push.
# (With a run-level group, GitHub cancelled whole runs whose test jobs had
# started but whose other jobs were still queued.)

env:
  PROJECT: PrompTugal.xcodeproj
  SCHEME: PrompTugal

jobs:
  build:
    name: App build and SGitVault tests
    runs-on: macos-26
    concurrency:
      group: ios-build-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # build info needs the commit count and tags

      - name: Select Xcode
        run: .github/scripts/select-xcode.sh

      - name: xcodebuild build
        run: |
          .github/scripts/run-and-summarize.sh "App build (iOS Simulator)" "$RUNNER_TEMP/logs/build.log" -- \
            xcodebuild build \
              -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath "$RUNNER_TEMP/dd" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: SGitVault swift test
        # Runs after the app build on the same runner: one runner fewer per push.
        if: always()
        run: |
          if [ ! -f Packages/SGitVault/Package.swift ]; then
            echo "Packages/SGitVault does not exist on this branch; nothing to test."
            echo "### ⏭️ SGitVault: no package on this branch, skipped" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cd Packages/SGitVault
          "$GITHUB_WORKSPACE/.github/scripts/run-and-summarize.sh" "SGitVault swift test" \
            "$RUNNER_TEMP/logs/swift-test.log" -- swift test

  test:
    name: App unit tests (${{ matrix.device }} simulator)
    # Runner capacity: on night/** pushes only the build job runs (compile + SGitVault tests,
    # one runner). The unit tests run on dev, on pull requests and by hand. Run them for a
    # night branch from the Actions tab (workflow_dispatch) when you need them before a merge.
    if: github.ref == 'refs/heads/dev' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        # The app must work on iPhone and iPad; both run every test.
        device: [iPhone, iPad]
    runs-on: macos-26
    timeout-minutes: 45
    concurrency:
      group: ios-test-${{ matrix.device }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: .github/scripts/select-xcode.sh

      - name: Pick and boot an ${{ matrix.device }} simulator
        id: sim
        timeout-minutes: 8
        run: |
          udid=$(.github/scripts/pick-simulator.py "${{ matrix.device }}")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true
          # Wait up to 5 minutes for "Booted"; if it is slower, xcodebuild finishes the boot.
          for i in $(seq 1 60); do
            xcrun simctl list devices | grep "$udid" | grep -q "(Booted)" && { echo "Booted after $((i * 5)) s"; break; }
            sleep 5
          done
          xcrun simctl list devices | grep "$udid" || true

      - name: xcodebuild test
        timeout-minutes: 20
        run: |
          .github/scripts/run-and-summarize.sh "App unit tests (${{ matrix.device }})" "$RUNNER_TEMP/logs/test.log" -- \
            xcodebuild test \
              -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
              -destination "id=${{ steps.sim.outputs.udid }}" \
              -derivedDataPath "$RUNNER_TEMP/dd" \
              -resultBundlePath "$RUNNER_TEMP/logs/Tests.xcresult" \
              -parallel-testing-enabled NO \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 60 \
              -maximum-test-execution-time-allowance 180 \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Upload log and results (failures only; the bundle is about 60 MB)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-log-${{ matrix.device }}
          path: ${{ runner.temp }}/logs/
          if-no-files-found: ignore

