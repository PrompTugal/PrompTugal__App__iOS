name: iOS

# CI is the compiler: nobody in the overnight push can build Swift on Linux.
# Every job copies compiler and test errors into its job summary, so a session
# can read a failure through the GitHub tools (actions_list, get_job_logs).
#
#   build    xcodebuild build for the iOS Simulator, unsigned, then swift test in
#            Packages/SGitVault on the same runner (skipped if the folder is missing)
#   release  xcodebuild build -configuration Release for a device, unsigned (app + extensions)
#   test     xcodebuild test on an iPhone and an iPad simulator: dev, pull requests
#            and workflow_dispatch only (night/** pushes get the build job alone)
#
# Pushes that change only briefs/, website/, root Markdown or VERSION don't run
# it: macOS runners are shared by every session, and those files can't break
# the app. (A .md file inside PrompTugal/ can, so those still run.)

on:
  push:
    branches: [dev, 'night/**']
    paths: ['**', '!briefs/**', '!website/**', '!*.md', '!VERSION']
  pull_request:
    paths: ['**', '!briefs/**', '!website/**', '!*.md', '!VERSION']
  workflow_dispatch:

permissions:
  contents: read

# Concurrency is per job, not per run. A job that has started always finishes;
# a job still waiting for a runner is replaced by the same job of a newer push.
# (With a run-level group, GitHub cancelled whole runs whose test jobs had
# started but whose other jobs were still queued.)

env:
  PROJECT: PrompTugal.xcodeproj
  SCHEME: PrompTugal

jobs:
  # Cheap Ubuntu check so a night branch that only merged dev costs no macOS runner:
  # on a push to night/**, if the pushed commit is already in origin/dev, dev's own
  # run covers it and the macOS jobs are skipped.
  gate:
    name: Already on dev?
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: check
        run: |
          run=true
          if [ "${{ github.event_name }}" = push ] && [[ "${{ github.ref }}" == refs/heads/night/* ]]; then
            git fetch --quiet origin dev
            if git merge-base --is-ancestor "$GITHUB_SHA" origin/dev; then
              run=false
              echo "### ⏭️ $GITHUB_SHA is already on dev; dev's run covers it, macOS jobs skipped" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "run=$run"

  # apps.json against the projects and the packages (scripts/apps/check_apps.py), on Ubuntu.
  apps:
    name: apps.json check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: check_apps.py and its tests
        run: |
          python3 scripts/apps/check_apps.py
          python3 scripts/apps/test_apps.py
          echo "### ✅ apps.json matches the projects and packages" >> "$GITHUB_STEP_SUMMARY"

  # The local packages' own tests, on an iPhone simulator (the packages target iOS only).
  packages:
    name: Package tests
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: macos-26
    concurrency:
      group: ios-packages-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: .github/scripts/select-xcode.sh

      - name: Pick and boot an iPhone simulator
        id: sim
        timeout-minutes: 8
        run: |
          udid=$(.github/scripts/pick-simulator.py "iPhone")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true

      - name: Test each package
        run: |
          fail=0
          for pkg in $(python3 -c "import json;print(' '.join(n for n in json.load(open('apps.json'))['packages'] if n != 'SGitVault'))"); do
            ( cd "Packages/$pkg" && "$GITHUB_WORKSPACE/.github/scripts/run-and-summarize.sh" "$pkg package tests" \
                "$RUNNER_TEMP/logs/pkg-$pkg.log" -- \
                xcodebuild test -scheme "$pkg" -destination "id=${{ steps.sim.outputs.udid }}" \
                  -derivedDataPath "$RUNNER_TEMP/dd-pkg" CODE_SIGNING_ALLOWED=NO ) || fail=1
          done
          exit $fail

  build:
    name: App build and SGitVault tests
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: macos-26
    concurrency:
      group: ios-build-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # build info needs the commit count and tags

      - name: Select Xcode
        run: .github/scripts/select-xcode.sh

      - name: xcodebuild build
        run: |
          .github/scripts/run-and-summarize.sh "App build (iOS Simulator)" "$RUNNER_TEMP/logs/build.log" -- \
            xcodebuild build \
              -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath "$RUNNER_TEMP/dd" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: SGitVault swift test
        # Runs after the app build on the same runner: one runner fewer per push.
        if: always()
        run: |
          if [ ! -f Packages/SGitVault/Package.swift ]; then
            echo "Packages/SGitVault does not exist on this branch; nothing to test."
            echo "### ⏭️ SGitVault: no package on this branch, skipped" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cd Packages/SGitVault
          "$GITHUB_WORKSPACE/.github/scripts/run-and-summarize.sh" "SGitVault swift test" \
            "$RUNNER_TEMP/logs/swift-test.log" -- swift test

  release:
    name: Release build (device, unsigned)
    # The configuration App Store and TestFlight builds use: optimised, DEBUG not defined, so
    # code behind #if DEBUG (launch arguments, the web inspector) must compile out cleanly.
    # Builds the app with its embedded widget and intents extensions and SGitVault. No signing.
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: macos-26
    concurrency:
      group: ios-release-build-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # build info needs the commit count and tags

      - name: Select Xcode
        run: .github/scripts/select-xcode.sh

      - name: xcodebuild build -configuration Release
        run: |
          .github/scripts/run-and-summarize.sh "Release build (iOS device, unsigned)" "$RUNNER_TEMP/logs/release.log" -- \
            xcodebuild build \
              -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$RUNNER_TEMP/dd" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          app=$(find "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' | head -1)
          echo "Built: $app"
          ls "$app/PlugIns" "$app/Extensions" 2>/dev/null || true
          # The extensions must be inside the app, or the archive would ship without them.
          for ext in PrompTugalWidgets.appex PrompTugalIntents.appex; do
            find "$app" -maxdepth 2 -name "$ext" | grep -q . || { echo "::error::$ext is not embedded in $app"; exit 1; }
          done
          echo "### ✅ Release build: app, widget and intents extensions" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: App unit tests (${{ matrix.device }} simulator)
    # Runner capacity: on night/** pushes only the build job runs (compile + SGitVault tests,
    # one runner). The unit tests run on dev, on pull requests and by hand. Run them for a
    # night branch from the Actions tab (workflow_dispatch) when you need them before a merge.
    needs: gate
    if: needs.gate.outputs.run == 'true' && (github.ref == 'refs/heads/dev' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        # The app must work on iPhone and iPad; both run every test.
        device: [iPhone, iPad]
    runs-on: macos-26
    timeout-minutes: 45
    concurrency:
      group: ios-test-${{ matrix.device }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: .github/scripts/select-xcode.sh

      - name: Pick and boot an ${{ matrix.device }} simulator
        id: sim
        timeout-minutes: 8
        run: |
          udid=$(.github/scripts/pick-simulator.py "${{ matrix.device }}")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true
          # Wait up to 5 minutes for "Booted"; if it is slower, xcodebuild finishes the boot.
          for i in $(seq 1 60); do
            xcrun simctl list devices | grep "$udid" | grep -q "(Booted)" && { echo "Booted after $((i * 5)) s"; break; }
            sleep 5
          done
          xcrun simctl list devices | grep "$udid" || true

      - name: xcodebuild test
        timeout-minutes: 20
        run: |
          .github/scripts/run-and-summarize.sh "App unit tests (${{ matrix.device }})" "$RUNNER_TEMP/logs/test.log" -- \
            xcodebuild test \
              -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
              -destination "id=${{ steps.sim.outputs.udid }}" \
              -derivedDataPath "$RUNNER_TEMP/dd" \
              -resultBundlePath "$RUNNER_TEMP/logs/Tests.xcresult" \
              -parallel-testing-enabled NO \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 60 \
              -maximum-test-execution-time-allowance 180 \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Upload log and results (failures only; the bundle is about 60 MB)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-log-${{ matrix.device }}
          path: ${{ runner.temp }}/logs/
          if-no-files-found: ignore

