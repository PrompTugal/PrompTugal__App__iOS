name: iOS

# CI is the compiler: nobody in the overnight push can build Swift on Linux.
# Every job copies compiler and test errors into its job summary, so a session
# can read a failure through the GitHub tools (actions_list, get_job_logs).
#
# Only what a change touches is built (contracts section 5). The `changes` job
# (ubuntu, ios-changes.yml) reads apps.json and the diff, then:
#
#   build     per affected app: Debug build for the iOS Simulator and Release build
#             for a device (unsigned), as two matrix legs
#   test      per affected app, on an iPhone and an iPad simulator: dev, pull requests
#             and workflow_dispatch only (night/** pushes build only; split/** branches run by workflow_dispatch)
#   packages  per affected Swift package with a Tests/ folder
#   result    one stable check name that is green when everything above is
#
# An app whose project does not exist yet is skipped, with a line in the summary.
# Before apps.json exists, the built-in config builds today's single app.
#
# Pushes that change only briefs/, website/, root Markdown or VERSION don't run
# it: macOS runners are shared by every session, and those files can't break
# the app. (A .md file inside PrompTugal/ can, so those still run.)

on:
  push:
    branches: [dev, 'night/**']
    paths: ['**', '!briefs/**', '!website/**', '!*.md', '!VERSION']
  pull_request:
    paths: ['**', '!briefs/**', '!website/**', '!*.md', '!VERSION']
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to build and test'
        type: choice
        options: [all, team, promptugal, riskmandate]
        default: all
      runner:
        description: 'macOS runner for the build, test and package jobs (self-hosted = the Mac registered to this repository)'
        type: choice
        options: [macos-26, self-hosted]
        default: macos-26

permissions:
  contents: read

# Concurrency is per job, not per run. A job that has started always finishes;
# a job still waiting for a runner is replaced by the same job of a newer push.
# (With a run-level group, GitHub cancelled whole runs whose test jobs had
# started but whose other jobs were still queued.)

jobs:
  # Cheap Ubuntu check so a night or split branch that only merged dev costs no macOS runner:
  # on a push to night/** or split/**, if the pushed commit is already in origin/dev, dev's own
  # run covers it and the macOS jobs are skipped.
  gate:
    name: Already on dev?
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: check
        run: |
          run=true
          if [ "${{ github.event_name }}" = push ] && [[ "${{ github.ref }}" == refs/heads/night/* || "${{ github.ref }}" == refs/heads/split/* ]]; then
            git fetch --quiet origin dev
            if git merge-base --is-ancestor "$GITHUB_SHA" origin/dev; then
              run=false
              echo "### ⏭️ $GITHUB_SHA is already on dev; dev's run covers it, macOS jobs skipped" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "run=$run"

  changes:
    name: Changes
    uses: ./.github/workflows/ios-changes.yml
    with:
      app: ${{ inputs.app || 'all' }}

  # Platform's test (contracts section 4). A job of its own, so a bad apps.json turns the
  # run red without stopping the builds that the plan already chose.
  check-apps:
    name: apps.json matches the projects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: check_apps.py
        run: |
          set -e
          if [ -f scripts/apps/check_apps.py ]; then
            python3 scripts/apps/check_apps.py
            [ -f scripts/apps/test_apps.py ] && python3 scripts/apps/test_apps.py
          else
            echo "scripts/apps/check_apps.py is not on this ref yet; skipped."
            echo "- ⏭️ check_apps.py: not on this ref yet, skipped" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: ${{ matrix.config }} build (${{ matrix.app.app }})
    needs: [gate, changes]
    if: needs.gate.outputs.run == 'true' && needs.changes.outputs.has_apps == 'true'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
        # Debug for the simulator; Release is what App Store and TestFlight builds use:
        # optimised, DEBUG not defined, so code behind #if DEBUG compiles out cleanly.
        config: [Debug, Release]
    runs-on: ${{ inputs.runner || 'macos-26' }}
    concurrency:
      group: ios-build-${{ matrix.app.app }}-${{ matrix.config }}-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 40
    env:
      PROJECT: ${{ matrix.app.project }}
      SCHEME: ${{ matrix.app.scheme }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # build info needs the commit count and tags

      - name: Select Xcode
        run: .github/scripts/select-xcode.sh

      - name: Debug build (iOS Simulator)
        if: matrix.config == 'Debug'
        run: |
          .github/scripts/run-and-summarize.sh "${{ matrix.app.app }}: Debug build (iOS Simulator)" "$RUNNER_TEMP/logs/build.log" -- \
            xcodebuild build \
              -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath "$RUNNER_TEMP/dd" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Release build (device, unsigned)
        if: matrix.config == 'Release'
        run: |
          .github/scripts/run-and-summarize.sh "${{ matrix.app.app }}: Release build (iOS device, unsigned)" "$RUNNER_TEMP/logs/release.log" -- \
            xcodebuild build \
              -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$RUNNER_TEMP/dd" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          app=$(find "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' | head -1)
          echo "Built: $app"
          # Each extension target of the project must be inside the app.
          scripts/release/check-embedded.sh "$app"

  test:
    name: ${{ matrix.app.app }} unit tests (${{ matrix.device }} simulator)
    # Runner capacity: on night/** and split/** pushes only the build legs run. The unit tests
    # run on dev, on pull requests and by hand. Run them for a branch from the Actions tab
    # (workflow_dispatch) when you need them before a merge.
    needs: [gate, changes]
    if: needs.gate.outputs.run == 'true' && needs.changes.outputs.has_apps == 'true' && (github.ref == 'refs/heads/dev' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
        # The app must work on iPhone and iPad; both run every test.
        device: [iPhone, iPad]
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 45
    concurrency:
      group: ios-test-${{ matrix.app.app }}-${{ matrix.device }}-${{ github.ref }}
      cancel-in-progress: false
    env:
      PROJECT: ${{ matrix.app.project }}
      SCHEME: ${{ matrix.app.scheme }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: .github/scripts/select-xcode.sh

      - name: Pick and boot an ${{ matrix.device }} simulator
        id: sim
        timeout-minutes: 8
        run: |
          udid=$(.github/scripts/pick-simulator.py "${{ matrix.device }}")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true
          # Wait up to 5 minutes for "Booted"; if it is slower, xcodebuild finishes the boot.
          for i in $(seq 1 60); do
            xcrun simctl list devices | grep "$udid" | grep -q "(Booted)" && { echo "Booted after $((i * 5)) s"; break; }
            sleep 5
          done
          xcrun simctl list devices | grep "$udid" || true

      - name: xcodebuild test
        timeout-minutes: 20
        run: |
          .github/scripts/run-and-summarize.sh "${{ matrix.app.app }}: unit tests (${{ matrix.device }})" "$RUNNER_TEMP/logs/test.log" -- \
            xcodebuild test \
              -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
              -destination "id=${{ steps.sim.outputs.udid }}" \
              -derivedDataPath "$RUNNER_TEMP/dd" \
              -resultBundlePath "$RUNNER_TEMP/logs/Tests.xcresult" \
              -parallel-testing-enabled NO \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 60 \
              -maximum-test-execution-time-allowance 180 \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Upload log and results (failures only; the bundle is about 60 MB)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-log-${{ matrix.app.app }}-${{ matrix.device }}
          path: ${{ runner.temp }}/logs/
          if-no-files-found: ignore

  packages:
    name: Package ${{ matrix.package.name }}
    # A package's own tests, when it or something it depends on changed. They run on every
    # push where they are affected, as SGitVault's did before the split (one runner each).
    needs: [gate, changes]
    if: needs.gate.outputs.run == 'true' && needs.changes.outputs.has_packages == 'true'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 30
    concurrency:
      group: ios-package-${{ matrix.package.name }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: .github/scripts/select-xcode.sh

      - name: Boot an iPhone simulator
        id: sim
        if: matrix.package.name != 'SGitVault'
        timeout-minutes: 8
        run: |
          udid=$(.github/scripts/pick-simulator.py iPhone)
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true
          for i in $(seq 1 60); do
            xcrun simctl list devices | grep "$udid" | grep -q "(Booted)" && break
            sleep 5
          done

      - name: Test ${{ matrix.package.name }}
        run: scripts/release/test-package.sh "${{ matrix.package.path }}" "${{ steps.sim.outputs.udid }}"

  # One check name that does not change with the matrix: green when every job that ran is
  # green (skipped jobs do not count against it). Branch protection can require this one.
  result:
    name: iOS result
    if: always()
    needs: [gate, changes, check-apps, build, test, packages]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}' | python3 -c '
          import json, sys
          bad = {k: v["result"] for k, v in json.load(sys.stdin).items() if v["result"] in ("failure", "cancelled")}
          print("failed:", bad or "none")
          sys.exit(1 if bad else 0)'
