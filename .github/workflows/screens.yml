name: Screens

# Screenshots of every main screen on an iPhone and an iPad simulator, so the
# team can see the app without a Mac. Only on dev and by hand: macOS runners
# are shared, and branch CI (ios.yml) stays at three jobs.
# Artifact: screens-<sha>, files <iphone|ipad>-<destination id>.png, longest side
# 1600 px. The editor publishes them on the site from successful dev runs.

on:
  push:
    branches: [dev]
    paths: ['**', '!briefs/**', '!website/**', '!*.md', '!VERSION']
  workflow_dispatch:

permissions:
  contents: read

# Per job, never cancelling a started job: a run takes about 20 minutes and dev
# gets a merge every 10-15, so cancel-in-progress meant no run ever finished.
# A job still waiting for a runner is replaced by the newer push's.

jobs:
  shoot:
    name: Screens (${{ matrix.device }})
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    runs-on: macos-26
    timeout-minutes: 40
    concurrency:
      group: screens-${{ matrix.device }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: .github/scripts/select-xcode.sh

      - name: Pick and boot an ${{ matrix.device }} simulator
        id: sim
        timeout-minutes: 8
        run: |
          udid=$(.github/scripts/pick-simulator.py "${{ matrix.device }}")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true
          for i in $(seq 1 60); do
            xcrun simctl list devices | grep "$udid" | grep -q "(Booted)" && break
            sleep 5
          done

      - name: Take the screenshots
        timeout-minutes: 25
        run: |
          .github/scripts/run-and-summarize.sh "Screens (${{ matrix.device }})" "$RUNNER_TEMP/logs/screens.log" -- \
            xcodebuild test \
              -project PrompTugal.xcodeproj -scheme PrompTugalScreens -configuration Debug \
              -destination "id=${{ steps.sim.outputs.udid }}" \
              -derivedDataPath "$RUNNER_TEMP/dd" \
              -resultBundlePath "$RUNNER_TEMP/Screens.xcresult" \
              -parallel-testing-enabled NO \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Export PNGs
        if: always()
        run: |
          # Names are the site's contract: <iphone|ipad>-<destination id>.png, longest side 1600 px.
          label=$(echo "${{ matrix.device }}" | tr '[:upper:]' '[:lower:]')
          .github/scripts/export-screens.py --self-test
          .github/scripts/export-screens.py "$RUNNER_TEMP/Screens.xcresult" "$RUNNER_TEMP/screens" "$label"
          for f in "$RUNNER_TEMP"/screens/*.png; do
            # iPad shots are taken in landscape-left. sips reads them as portrait; rotating gives
            # upright landscape stored pixels (confirmed by the editor on run 12). The EXIF tag
            # that would turn them back in a browser is removed by png-normalize.py below.
            if [ "$label" = ipad ]; then
              w=$(sips -g pixelWidth "$f" | awk '/pixelWidth/{print $2}')
              h=$(sips -g pixelHeight "$f" | awk '/pixelHeight/{print $2}')
              [ "$w" -lt "$h" ] && sips -r 270 "$f" >/dev/null
            fi
            sips -Z 1600 "$f" >/dev/null
          done
          # Drop EXIF orientation (XCTest tags iPad landscape shots Orientation=8, so browsers turn
          # them sideways) and check the stored pixel size from IHDR: iPad must be landscape.
          bad=0
          if [ "$label" = ipad ]; then landscape=--landscape; else landscape=; fi
          python3 .github/scripts/png-normalize.py --self-test
          python3 .github/scripts/png-normalize.py $landscape "$RUNNER_TEMP"/screens/*.png || bad=1
          count=$(ls "$RUNNER_TEMP"/screens/*.png | wc -l | tr -d ' ')
          echo "$count screenshots for ${{ matrix.device }}" >> "$GITHUB_STEP_SUMMARY"
          # One per id in PrompTugalUITests/ScreensTests.swift (13); update both together.
          if [ "$count" -ne 13 ]; then echo "::error::$count screenshots for ${{ matrix.device }}, expected 13"; bad=1; fi
          ls -la "$RUNNER_TEMP/screens"
          ls "$RUNNER_TEMP/screens" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          [ "$bad" = 0 ]

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screens-${{ github.sha }}-${{ matrix.device }}
          path: ${{ runner.temp }}/screens/
          if-no-files-found: warn
          retention-days: 14

  collect:
    name: One artifact for both devices
    needs: shoot
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: screens-${{ github.sha }}
          pattern: screens-${{ github.sha }}-*
          delete-merged: true
