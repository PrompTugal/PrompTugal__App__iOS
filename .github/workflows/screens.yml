name: Screens

# Screenshots of every main screen on an iPhone and an iPad simulator, so the
# team can see the app without a Mac. By hand only (workflow_dispatch): macOS runners
# are shared, and branch CI (ios.yml) stays at a few jobs.
# Per app: only the apps a change touches, and only apps whose project has a shared
# "<Scheme>Screens" scheme (optional apps.json keys screensScheme, screensCount).
# Artifact: screens-<sha>, files <iphone|ipad>-<destination id>.png, longest side
# 1600 px. The app with bundle news.promptugal.reader keeps that name (the editor
# publishes it on the site from successful dev runs); the others get screens-<sha>-<app>.

on:
  # By hand only: about 26 simulator screenshots per run is most of the macOS queue.
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to photograph'
        type: choice
        options: [all, team, promptugal, riskmandate, fringe]
        default: all
      store:
        description: 'App Store screenshots instead of the site set: 6.9" and 6.5" iPhone and 13" iPad at the native pixel size, one set per locale. Use app=promptugal.'
        type: boolean
        default: false
      ids:
        description: 'Store screenshots: screen ids to keep, in store order, comma-separated (empty = all, alphabetical). Apple takes at most 10 per set.'
        type: string
        default: 'now,team.schedule,explore,explore.talk,news.home,explore.people,explore.graph'
      ids_required:
        description: 'Store screenshots: the ids that must exist (comma-separated); any other id in ids that is missing is skipped with a warning'
        type: string
        default: 'now,team.schedule,explore,news.home'
      seed_picks:
        description: 'Store screenshots: pick ids to seed into "my program" (comma-separated). Passed to the screens test as PT_SEED_PICKS (TEST_RUNNER_PT_SEED_PICKS); the test adds the launch argument -PTSeedPicks <value>. Empty = none.'
        type: string
        default: 'events/has-europe-s-tech-moment-arrived/index.html,events/double-agents-are-your-employees-ai-agents-working-for-or/index.html,events/ai-your-new-news-editor/index.html,events/the-agentic-internet-who-controls-the-web/index.html,events/trust-issues-letting-ai-agents-into-production-safely/index.html'
      hide_term:
        description: 'Store screenshots: hide every agenda event and news item whose title or place contains this text (no third-party trademarks in store images). Passed to the screens test as PT_HIDE_TERM (TEST_RUNNER_PT_HIDE_TERM); the test adds the DEBUG-only launch argument -PTHideTerm <text>. Empty = hide nothing.'
        type: string
        default: 'Web Summit'
      now:
        description: 'Store screenshots: pretend the time is this ISO date (e.g. 2026-11-10T11:00:00Z). Passed to the screens test as the environment variable PT_NOW (TEST_RUNNER_PT_NOW); the test adds the launch argument -PTNow <date>. Empty = real time.'
        type: string
        default: '2026-11-10T11:00:00Z'
      locales:
        description: 'Store screenshots: locales, comma-separated (language code, then region; en-US, pt-PT, pt-BR)'
        type: string
        default: 'en-US,pt-PT,pt-BR'

permissions:
  contents: read

# Per job, never cancelling a started job: a run takes about 20 minutes and dev
# gets a merge every 10-15, so cancel-in-progress meant no run ever finished.
# A job still waiting for a runner is replaced by the newer push's.

jobs:
  changes:
    name: Changes
    permissions:
      contents: read
      actions: read   # the called workflow reads earlier runs
    uses: ./.github/workflows/ios-changes.yml
    with:
      app: ${{ inputs.app || 'all' }}

  shoot:
    name: Screens (${{ matrix.app.app }}, ${{ matrix.device }})
    needs: changes
    if: needs.changes.outputs.has_screens == 'true' && !inputs.store
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.screens) }}
        device: [iPhone, iPad]
    runs-on: macos-26
    timeout-minutes: 40
    concurrency:
      group: screens-${{ matrix.app.app }}-${{ matrix.device }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: .github/scripts/select-xcode.sh

      - name: Pick and boot an ${{ matrix.device }} simulator
        id: sim
        timeout-minutes: 8
        run: |
          udid=$(.github/scripts/pick-simulator.py "${{ matrix.device }}")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true
          for i in $(seq 1 60); do
            xcrun simctl list devices | grep "$udid" | grep -q "(Booted)" && break
            sleep 5
          done

      - name: Take the screenshots
        timeout-minutes: 25
        run: |
          .github/scripts/run-and-summarize.sh "Screens (${{ matrix.app.app }}, ${{ matrix.device }})" "$RUNNER_TEMP/logs/screens.log" -- \
            xcodebuild test \
              -project "${{ matrix.app.project }}" -scheme "${{ matrix.app.screens_scheme }}" -configuration Debug \
              -destination "id=${{ steps.sim.outputs.udid }}" \
              -derivedDataPath "$RUNNER_TEMP/dd" \
              -resultBundlePath "$RUNNER_TEMP/Screens.xcresult" \
              -parallel-testing-enabled NO \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Export PNGs
        if: always()
        run: |
          # Names are the site's contract: <iphone|ipad>-<destination id>.png, longest side 1600 px.
          label=$(echo "${{ matrix.device }}" | tr '[:upper:]' '[:lower:]')
          .github/scripts/export-screens.py --self-test
          .github/scripts/export-screens.py "$RUNNER_TEMP/Screens.xcresult" "$RUNNER_TEMP/screens" "$label"
          # XCTest stores the framebuffer and an EXIF Orientation tag saying how to turn it (iPad
          # landscape: the portrait buffer). Read the tag, strip it (and XMP) so no viewer turns
          # the picture again, then turn the stored pixels the way the tag said, with sips
          # (-r is clockwise): 6 -> 90, 3 -> 180, 8 -> 270. Then longest side 1600 px.
          for f in "$RUNNER_TEMP"/screens/*.png; do
            o=$(python3 .github/scripts/png-normalize.py --orientation "$f")
            python3 .github/scripts/png-normalize.py "$f" >/dev/null
            w=$(sips -g pixelWidth "$f" | awk '/pixelWidth/{print $2}')
            h=$(sips -g pixelHeight "$f" | awk '/pixelHeight/{print $2}')
            echo "$(basename "$f"): captured ${w}x${h}, EXIF orientation $o"
            case "$o" in
              1) ;;
              3) sips -r 180 "$f" >/dev/null ;;
              6) sips -r 90 "$f" >/dev/null ;;
              8) sips -r 270 "$f" >/dev/null ;;
              *) echo "::warning::$(basename "$f"): mirrored EXIF orientation $o, left as captured" ;;
            esac
            sips -Z 1600 "$f" >/dev/null
          done
          # Check: no eXIf left, and the stored size (IHDR) of every iPad PNG is landscape.
          bad=0
          if [ "$label" = ipad ]; then landscape=--landscape; else landscape=; fi
          python3 .github/scripts/png-normalize.py --self-test
          python3 .github/scripts/png-normalize.py $landscape "$RUNNER_TEMP"/screens/*.png || bad=1
          count=$(ls "$RUNNER_TEMP"/screens/*.png | wc -l | tr -d ' ')
          echo "$count screenshots for ${{ matrix.device }}" >> "$GITHUB_STEP_SUMMARY"
          # One per id in the app's ScreensTests.swift (13 for PrompTugal today); update both together.
          # screens_count is 0 when apps.json does not say: then any number above 0 passes.
          want=${{ matrix.app.screens_count }}
          if [ "$want" -gt 0 ] && [ "$count" -ne "$want" ]; then echo "::error::$count screenshots for ${{ matrix.device }}, expected $want"; bad=1; fi
          if [ "$count" -eq 0 ]; then echo "::error::no screenshots for ${{ matrix.app.app }}"; bad=1; fi
          ls -la "$RUNNER_TEMP/screens"
          ls "$RUNNER_TEMP/screens" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          [ "$bad" = 0 ]

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screens-${{ github.sha }}-${{ matrix.app.app }}-${{ matrix.device }}
          path: ${{ runner.temp }}/screens/
          if-no-files-found: warn
          retention-days: 14

  collect:
    name: One artifact for both devices (${{ matrix.app.app }})
    needs: [changes, shoot]
    if: always() && needs.changes.outputs.has_screens == 'true' && !inputs.store
    strategy:
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.screens) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: screens-${{ github.sha }}${{ matrix.app.suffix }}
          pattern: screens-${{ github.sha }}-${{ matrix.app.app }}-*
          delete-merged: true

  # App Store screenshots (manual, store=true). One job per display size, all locales in the job:
  # the app is built once, then the screens test runs once per locale (-testLanguage/-testRegion).
  # Pixel size is the device's, so nothing is scaled: iPhone 17 Pro Max 1320x2868 (6.9"),
  # iPhone 14 Plus 1284x2778 or 11 Pro Max 1242x2688 (6.5"), iPad Pro 13" 2064x2752. store-check.py
  # fails the job on any other size. Output: <locale>/<NN>-<screen id>.jpg (JPEG: App Store Connect
  # takes no alpha channel), in artifact appstore-screens-<sha>-<size>.
  store:
    name: Store screens (${{ matrix.app.app }}, ${{ matrix.size.kind }})
    needs: changes
    if: needs.changes.outputs.has_screens == 'true' && inputs.store
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.screens) }}
        size:
          - {kind: iphone-6.9, devices: "iPhone 17 Pro Max|iPhone 16 Pro Max", label: iphone}
          - {kind: iphone-6.5, devices: "iPhone 14 Plus|iPhone 13 Pro Max|iPhone 11 Pro Max|iPhone XS Max", label: iphone}
          - {kind: ipad-13, devices: "iPad Pro 13-inch (M5)|iPad Pro 13-inch (M4)", label: ipad}
    runs-on: macos-26
    timeout-minutes: 60
    concurrency:
      group: store-screens-${{ matrix.app.app }}-${{ matrix.size.kind }}-${{ github.ref }}
      cancel-in-progress: false
    env:
      LOCALES: ${{ inputs.locales }}
      IDS: ${{ inputs.ids }}
      IDS_REQUIRED: ${{ inputs.ids_required }}
      TEST_RUNNER_PT_NOW: ${{ inputs.now }}
      TEST_RUNNER_PT_SEED_PICKS: ${{ inputs.seed_picks }}
      TEST_RUNNER_PT_HIDE_TERM: ${{ inputs.hide_term }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: .github/scripts/select-xcode.sh

      - name: Create and boot the ${{ matrix.size.kind }} simulator
        id: sim
        timeout-minutes: 8
        run: |
          IFS='|' read -r -a names <<< "${{ matrix.size.devices }}"
          udid=$(.github/scripts/store-simulator.py "${names[@]}")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true
          for i in $(seq 1 60); do
            xcrun simctl list devices | grep "$udid" | grep -q "(Booted)" && break
            sleep 5
          done
          # Light appearance and a clean status bar, the same for every set.
          xcrun simctl ui "$udid" appearance light || true
          xcrun simctl status_bar "$udid" override --time "9:41" --batteryState charged --batteryLevel 100 \
            --cellularMode active --cellularBars 4 --wifiBars 3 || true

      - name: Take the screenshots, once per locale
        timeout-minutes: 45
        run: |
          mkdir -p "$RUNNER_TEMP/store"
          IFS=',' read -r -a locales <<< "$LOCALES"
          for loc in "${locales[@]}"; do
            loc=$(echo "$loc" | tr -d ' ')
            lang=$loc; region=${loc##*-}
            result="$RUNNER_TEMP/Screens-$loc.xcresult"
            .github/scripts/run-and-summarize.sh "Store screens ${{ matrix.size.kind }} $loc" "$RUNNER_TEMP/logs/screens-$loc.log" -- \
              xcodebuild test \
                -project "${{ matrix.app.project }}" -scheme "${{ matrix.app.screens_scheme }}" -configuration Debug \
                -destination "id=${{ steps.sim.outputs.udid }}" \
                -derivedDataPath "$RUNNER_TEMP/dd" \
                -resultBundlePath "$result" \
                -only-testing:PrompTugalUITests/ScreensTests \
                -testLanguage "$lang" -testRegion "$region" \
                -parallel-testing-enabled NO \
                CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO || true
            .github/scripts/export-screens.py "$result" "$RUNNER_TEMP/store/$loc" "${{ matrix.size.label }}" || true
            # The screens test names its attachments with a store-order prefix ("01-now"); the ids input
            # uses the plain id ("now"), so drop the prefix: iphone-01-now.png -> iphone-now.png.
            for f in "$RUNNER_TEMP/store/$loc/"*.png; do
              [ -e "$f" ] || continue
              b=$(basename "$f"); n=$(echo "$b" | sed -E 's/^(iphone|ipad)-[0-9]+-/\1-/')
              [ "$b" = "$n" ] || mv "$f" "$(dirname "$f")/$n"
            done
          done

      - name: Normalise, check sizes, convert to JPEG
        run: |
          .github/scripts/store-check.py --self-test
          bad=0
          for dir in "$RUNNER_TEMP"/store/*/; do
            loc=$(basename "$dir")
            n=0
            # Store order: the ids input, in that order (a missing required id is an error, another missing id a warning);
            # empty means every screen, alphabetical.
            if [ -n "${IDS// /}" ]; then
              files=()
              IFS=',' read -r -a want <<< "$IDS"
              for id in "${want[@]}"; do
                id=$(echo "$id" | tr -d ' ')
                f="${dir}${{ matrix.size.label }}-$id.png"
                if [ -e "$f" ]; then files+=("$f")
                elif [[ ",${IDS_REQUIRED// /}," == *",$id,"* ]]; then echo "::error::$loc: no screenshot for required id '$id' ($f)"; bad=1
                else echo "::warning::$loc: no screenshot for id '$id', skipped"; fi
              done
            else
              files=("$dir"*.png)
            fi
            for f in "${files[@]}"; do
              [ -e "$f" ] || continue
              o=$(python3 .github/scripts/png-normalize.py --orientation "$f")
              python3 .github/scripts/png-normalize.py "$f" >/dev/null
              case "$o" in 3) sips -r 180 "$f" >/dev/null ;; 6) sips -r 90 "$f" >/dev/null ;; 8) sips -r 270 "$f" >/dev/null ;; esac
              n=$((n+1)); id=$(basename "$f" .png | sed -E 's/^(iphone|ipad)-//')
              sips -s format jpeg -s formatOptions 100 "$f" --out "$dir$(printf '%02d' $n)-$id.jpg" >/dev/null
            done
            rm -f "$dir"*.png
            if ls "$dir"*.jpg >/dev/null 2>&1; then
              python3 .github/scripts/store-check.py "${{ matrix.size.kind }}" "$dir"*.jpg || bad=1
            else
              echo "::error::$loc: no screenshots to check for ${{ matrix.size.kind }}"; bad=1
            fi
            echo "- $loc: $n screenshots (${{ matrix.size.kind }})" >> "$GITHUB_STEP_SUMMARY"
          done
          [ "$bad" = 0 ] || { echo "::error::a screenshot has a size App Store Connect does not take for ${{ matrix.size.kind }}"; exit 1; }
          ls -R "$RUNNER_TEMP/store" | head -80

      - name: Delete the simulator
        if: always() && steps.sim.outputs.udid != ''
        run: xcrun simctl delete "${{ steps.sim.outputs.udid }}" || true

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: appstore-screens-${{ github.sha }}-${{ matrix.app.app }}-${{ matrix.size.kind }}
          path: ${{ runner.temp }}/store/
          if-no-files-found: warn
          retention-days: 14

  store-collect:
    name: One store artifact (${{ matrix.app.app }})
    needs: [changes, store]
    if: always() && needs.changes.outputs.has_screens == 'true' && inputs.store
    strategy:
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.screens) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: appstore-screens-${{ github.sha }}-${{ matrix.app.app }}-*
          path: out
      - name: Lay out as <locale>/<display type>/<NN-id>.jpg
        run: |
          mkdir -p final
          for d in out/*/; do
            kind=${d#out/appstore-screens-${{ github.sha }}-${{ matrix.app.app }}-}; kind=${kind%/}
            case "$kind" in iphone-6.9) disp=APP_IPHONE_69 ;; iphone-6.5) disp=APP_IPHONE_65 ;; ipad-13) disp=APP_IPAD_PRO_3GEN_129 ;; *) disp=$kind ;; esac
            for l in "$d"*/; do
              loc=$(basename "$l"); mkdir -p "final/$loc/$disp"; cp "$l"*.jpg "final/$loc/$disp/" 2>/dev/null || true
            done
          done
          find final -type f | sort | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        with:
          name: appstore-screens-${{ github.sha }}-${{ matrix.app.app }}
          path: final/
          retention-days: 14
