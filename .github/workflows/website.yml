name: Release and deploy

# On every push to dev:
#   1. release  bump /VERSION (v0.1.n -> v0.1.n+1), commit it, tag it, push both to dev
#   2. build    test, build and validate the site from that release commit
#   3. deploy   publish to GitHub Pages (ios.app.promptugal.news) and confirm the
#               live site serves the release; the deploy is not done until it does
# On pull requests, only the build job runs, with no release and no deploy.
#
# The release commit is pushed with GITHUB_TOKEN, which does not start another
# workflow run, so there is no loop.

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Bump the release version
        id: bump
        run: echo "version=$(python3 website/version.py bump)" >> "$GITHUB_OUTPUT"

      - name: Commit, tag and push
        id: push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release: $VERSION" -- VERSION
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin HEAD:dev "refs/tags/$VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "### Released $VERSION" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: release
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # the latest iOS build panel reads the release workflow's runs and artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha || github.sha }}
          fetch-depth: 0   # the release history and status pages are read from git tags and log

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test the builder and the validator
        run: python3 -m unittest website/test_site.py -v

      - name: Latest iOS build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -x scripts/release/latest-build.sh ]; then
            scripts/release/latest-build.sh "$RUNNER_TEMP/ios-build.json" dev || echo '{"available": false}' > "$RUNNER_TEMP/ios-build.json"
          else
            echo '{"available": false}' > "$RUNNER_TEMP/ios-build.json"
          fi

      - name: Latest app screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        # The newest screens.yml run on dev that left a screens-* artifact with PNGs, whatever the run's
        # overall result: one device's job can fail or be cancelled while the other's images are good.
        # Files are <device>-<id>.png; the site publishes only registered screen ids and the devices in
        # website/screens.json. Never fails the site: without screenshots the pages say so.
        run: |
          mkdir -p "$RUNNER_TEMP/screens"
          for run in $(gh run list --workflow screens.yml --branch dev --status completed --limit 10 \
                         --json databaseId -q '.[].databaseId' 2>/dev/null); do
            rm -rf "$RUNNER_TEMP/screens"/*
            gh run download "$run" --pattern 'screens-*' -D "$RUNNER_TEMP/screens" >/dev/null 2>&1 || true
            n=$(find "$RUNNER_TEMP/screens" -name 'iphone-*.png' | wc -l)   # the site publishes iPhone shots first
            if [ "$n" -gt 0 ]; then
              gh run view "$run" --json number -q .number > "$RUNNER_TEMP/screens/run.txt"
              echo "Screenshots from screens.yml run $(cat "$RUNNER_TEMP/screens/run.txt") ($run): $n iPhone PNGs"
              break
            fi
          done
          find "$RUNNER_TEMP/screens" -name '*.png' | sed 's|.*/||' | sort

      - name: Build
        env:
          SITE_COMMIT: ${{ needs.release.outputs.sha || github.sha }}
          IOS_BUILD_JSON: ${{ runner.temp }}/ios-build.json
          SCREENS_DIR: ${{ runner.temp }}/screens
        run: python3 website/build.py

      - name: Validate
        run: python3 website/validate.py

      - name: Show the version stamp
        run: cat website/public/version.json

      - name: Upload the Pages artifact
        if: needs.release.result == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/public

  deploy:
    needs: [release, build]
    if: needs.release.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live
        env:
          SITE: https://ios.app.promptugal.news
          WANT: ${{ needs.release.outputs.version }}
        run: |
          for attempt in $(seq 1 20); do
            live=$(curl -fsS "$SITE/version.json?nocache=$attempt" | python3 -c 'import json,sys; print(json.load(sys.stdin)["release"])' || true)
            echo "attempt $attempt: live '${live}', want '${WANT}'"
            [ "$live" = "$WANT" ] && exit 0
            sleep 15
          done
          echo "::error::$SITE does not serve $WANT after 5 minutes"
          exit 1
